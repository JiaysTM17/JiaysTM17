<svg width="1000" height="210" viewBox="0 0 1000 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barAmber" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="996" height="206" rx="14" fill="url(#cbg)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="28" y="32" fill="#60a5fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">CORE ENGINEERING COMPETENCIES</text>

  <!-- Left Top: Backend Architecture -->
  <text x="28" y="68" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600">Backend Architecture (Java 21 • Spring Boot • Node.js)</text>
  <text x="472" y="68" text-anchor="end" fill="#60a5fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700">92%</text>
  <rect x="28" y="78" width="444" height="10" rx="5" fill="#1e293b"/>
  <rect x="28" y="78" width="408" height="10" rx="5" fill="url(#barBlue)">
    <animate attributeName="width" from="0" to="408" dur="1.1s" fill="freeze"/>
  </rect>

  <!-- Left Bottom: Database & Real-Time -->
  <text x="28" y="138" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600">Database &amp; Real-Time (PostgreSQL • MongoDB • WebSocket)</text>
  <text x="472" y="138" text-anchor="end" fill="#c084fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700">88%</text>
  <rect x="28" y="148" width="444" height="10" rx="5" fill="#1e293b"/>
  <rect x="28" y="148" width="390" height="10" rx="5" fill="url(#barPurple)">
    <animate attributeName="width" from="0" to="390" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- Right Top: Frontend & Interactive UI -->
  <text x="528" y="68" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600">Frontend &amp; Interactive UI (React • TypeScript • 60fps JS)</text>
  <text x="972" y="68" text-anchor="end" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700">86%</text>
  <rect x="528" y="78" width="444" height="10" rx="5" fill="#1e293b"/>
  <rect x="528" y="78" width="382" height="10" rx="5" fill="url(#barGreen)">
    <animate attributeName="width" from="0" to="382" dur="1.25s" fill="freeze"/>
  </rect>

  <!-- Right Bottom: Testing, Security & DevOps -->
  <text x="528" y="138" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600">Testing &amp; Security (3,151 Tests • OWASP • JWT • Docker)</text>
  <text x="972" y="138" text-anchor="end" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700">90%</text>
  <rect x="528" y="148" width="444" height="10" rx="5" fill="#1e293b"/>
  <rect x="528" y="148" width="400" height="10" rx="5" fill="url(#barAmber)">
    <animate attributeName="width" from="0" to="400" dur="1.3s" fill="freeze"/>
  </rect>

  <!-- Subtle Footer Note -->
  <text x="28" y="188" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Continuously practicing clean code, system design &amp; automated QA @ HCMUTE</text>
</svg>
