        <path d="M2.5 1.5L12 6.8L7.3 8.2L5.2 12.8L2.5 1.5Z" fill="#06b6d4" stroke="#ffffff" stroke-width="1.1" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  <g transform="translate(864, 52)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -9,-7; 0,0" dur="5.5s" repeatCount="indefinite"/>
      <g transform="rotate(35)">
        <path d="M2.5 1.5L15 8.5L9.2 10.3L6.5 16L2.5 1.5Z" fill="#10b981" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  <g transform="translate(906, 132)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 7,8; 0,0" dur="6.4s" repeatCount="indefinite"/>
      <g transform="rotate(-25)">
        <path d="M2.5 1.5L13.5 7.5L8.2 9.1L5.8 14.2L2.5 1.5Z" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  <g transform="translate(806, 148)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -7,6; 0,0" dur="4.9s" repeatCount="indefinite"/>
