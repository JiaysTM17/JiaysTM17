  <text x="500" y="136" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500">Software &amp; Fullstack Developer  •  @JiaysTM17  •  Ho Chi Minh City</text>
