<svg width="1000" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0" y1="155" x2="1000" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.38"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Base Dark Canvas + Blueprint Grid -->
  <rect width="1000" height="220" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="220" rx="14" fill="url(#grid)"/>
  <ellipse cx="500" cy="105" rx="390" ry="115" fill="url(#glowBlue)"/>

  <!-- Subtle Bottom Wave Accent -->
