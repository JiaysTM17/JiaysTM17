<svg width="1000" height="210" viewBox="0 0 1000 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0" y1="150" x2="1000" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Base Dark Canvas + Blueprint Grid -->
  <rect width="1000" height="210" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="210" rx="14" fill="url(#grid)"/>
  <ellipse cx="500" cy="100" rx="380" ry="110" fill="url(#glowBlue)"/>

  <!-- Subtle Bottom Wave Accent -->
  <path d="M0 165 Q 250 135 500 165 T 1000 165 L 1000 210 L 0 210 Z" fill="url(#waveGrad)"/>
  <path d="M0 165 Q 250 135 500 165 T 1000 165" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>

  <!-- Decorative Swarm Agent Arrowheads (matching Portfolio Swarm UI) -->
  <g transform="translate(82, 46) rotate(-15)">
    <path d="M2.5 1.5L15 8.5L9.2 10.3L6.5 16L2.5 1.5Z" fill="#3b82f6" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(132, 134) rotate(22)">
    <path d="M2.5 1.5L13.5 7.5L8.2 9.1L5.8 14.2L2.5 1.5Z" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <g transform="translate(868, 48) rotate(35)">
    <path d="M2.5 1.5L15 8.5L9.2 10.3L6.5 16L2.5 1.5Z" fill="#10b981" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(908, 128) rotate(-25)">
    <path d="M2.5 1.5L13.5 7.5L8.2 9.1L5.8 14.2L2.5 1.5Z" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <g transform="translate(808, 146) rotate(10)">
    <path d="M2.5 1.5L12 6.8L7.3 8.2L5.2 12.8L2.5 1.5Z" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.1" stroke-linejoin="round"/>
  </g>

  <!-- Outer Crisp Border -->
  <rect x="0.75" y="0.75" width="998.5" height="208.5" rx="13.25" stroke="#2563eb" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Pill Tag -->
  <rect x="372" y="28" width="256" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.5"/>
  <circle cx="388" cy="40" r="4" fill="#10b981"/>
  <text x="506" y="44" text-anchor="middle" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">COMPUTER SCIENCE • HCMUTE</text>

  <!-- Main Name & Greeting -->
  <text x="500" y="102" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">Hi, I'm Trương Gia Kiệt 👋</text>

